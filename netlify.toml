# Deploy no Netlify: site 100% estático (Astro) + Netlify Functions para o formulário (T8).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"
  # A chave PÚBLICA do Turnstile vai (de propósito) dentro do HTML da página de contato. Sem esta linha, o
  # "secrets scanning" do Netlify a confundiria com um segredo vazado e reprovaria o deploy.
  # (Os segredos de verdade — RESEND_API_KEY e TURNSTILE_SECRET_KEY — nunca aparecem no HTML.)
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_TURNSTILE_SITE_KEY"

# O Netlify serve /quem-somos a partir de quem-somos.html (Astro build.format = 'file').
# Mantém exatamente as URLs do site antigo (sem barra final).
[build.processing]
  skip_processing = true # Astro já minifica; evita reprocessar CSS/JS/imagens

# ---------- Redirecionamentos ----------
# Painel administrativo removido (D1): 410 Gone avisa aos buscadores que saiu de vez.
[[redirects]]
  from = "/cms"
  to = "/404.html"
  status = 410
  force = true

[[redirects]]
  from = "/cms/*"
  to = "/404.html"
  status = 410
  force = true

# Variações comuns da URL antiga → canônica
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/servicos/"
  to = "/servicos"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# ---------- Cabeçalhos de segurança e cache ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # CSP estrita: sem unsafe-eval e sem unsafe-inline. Turnstile (formulário) já liberado; GTM/Meta Pixel entram na T11.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Cache-Control = "public, max-age=0, must-revalidate"

# Arquivos com hash no nome (gerados pelo Astro) podem ser cacheados para sempre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
